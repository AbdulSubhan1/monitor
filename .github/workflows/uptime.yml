# Vercel Hobby crons run at most once a day, so GitHub Actions (free on a public repo) runs the uptime check.
# GitHub may start a scheduled run a few minutes late; the dashboard shows a missed slot as grey, not as "up".
name: Uptime check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run the checks
        env:
          PULSE_URL: ${{ vars.PULSE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$PULSE_URL/api/cron/check"
