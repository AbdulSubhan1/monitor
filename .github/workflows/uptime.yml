# Manual uptime run. The 10-minute schedule moved to Upstash QStash (src/server/qstash.ts): GitHub's free schedules are
# best effort, and on this repo the first scheduled run never came in the first 45 minutes.
name: Uptime check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run the checks
        env:
          PULSE_URL: ${{ vars.PULSE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$PULSE_URL/api/cron/check"
